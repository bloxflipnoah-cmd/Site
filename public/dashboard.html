<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="dashboard-page">
    <!-- Fond étoilé -->
    <div class="starfield"></div>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">Obistral</div>

            <div class="sidebar-header">
                <img id="sidebarAvatar" src="" alt="Avatar" class="sidebar-avatar">
                <div>
                    <div id="sidebarUsername" class="sidebar-username">Username</div>
                </div>
            </div>

            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <h1 id="greeting">Welcome!</h1>
                <p class="header-sub">Manage your quests in one click</p>
                <div class="header-stats">
                    <div class="header-stat">
                        <span class="stat-label">Remaining</span>
                        <span id="questCount" class="stat-value">0</span>
                    </div>
                </div>
            </div>

            <!-- Stats Stars - Cross Layout -->
            <div class="stats-cross">
                <!-- Top - Done -->
                <div class="stat-orb top" id="completedOrb" data-label="Done">
                    <div class="orb-aura"></div>
                    <div class="stat-facet facet-1"></div>
                    <div class="stat-facet facet-2"></div>
                    <div class="stat-facet facet-3"></div>
                    <div class="stat-facet facet-4"></div>
                    <div class="stat-facet facet-5"></div>
                    <div class="stat-facet facet-6"></div>
                    <div class="stat-facet facet-7"></div>
                    <div class="stat-light"></div>
                    <div class="stat-content">
                        <div class="stat-label">Done</div>
                        <div class="stat-value" id="completedQuests">0</div>
                    </div>
                    <div class="stat-star">★</div>
                    <div class="stat-shine"></div>
                </div>

                <!-- Left - Progress -->
                <div class="stat-orb left" id="progressOrb" data-label="Progress">
                    <div class="orb-aura"></div>
                    <div class="stat-facet facet-1"></div>
                    <div class="stat-facet facet-2"></div>
                    <div class="stat-facet facet-3"></div>
                    <div class="stat-facet facet-4"></div>
                    <div class="stat-facet facet-5"></div>
                    <div class="stat-facet facet-6"></div>
                    <div class="stat-facet facet-7"></div>
                    <div class="stat-light"></div>
                    <div class="stat-content">
                        <div class="stat-label">Progress</div>
                        <div class="stat-value" id="progressPercent">0%</div>
                    </div>
                    <div class="stat-star">★</div>
                    <div class="stat-shine"></div>
                    <div class="progress-ring"></div>
                    <div class="progress-fill"></div>
                </div>

                <!-- Center - Do All -->
                <div class="stat-orb center" id="completeAllBtn" data-label="Do All">
                    <div class="orb-aura"></div>
                    <div class="stat-facet facet-1"></div>
                    <div class="stat-facet facet-2"></div>
                    <div class="stat-facet facet-3"></div>
                    <div class="stat-facet facet-4"></div>
                    <div class="stat-facet facet-5"></div>
                    <div class="stat-facet facet-6"></div>
                    <div class="stat-facet facet-7"></div>
                    <div class="stat-light"></div>
                    <div class="stat-content">
                        <div class="stat-label">Do All</div>
                    </div>
                    <div class="stat-star">★</div>
                    <div class="stat-shine"></div>
                </div>

                <!-- Right - To do -->
                <div class="stat-orb right" id="remainingOrb" data-label="To do">
                    <div class="orb-aura"></div>
                    <div class="stat-facet facet-1"></div>
                    <div class="stat-facet facet-2"></div>
                    <div class="stat-facet facet-3"></div>
                    <div class="stat-facet facet-4"></div>
                    <div class="stat-facet facet-5"></div>
                    <div class="stat-facet facet-6"></div>
                    <div class="stat-facet facet-7"></div>
                    <div class="stat-light"></div>
                    <div class="stat-content">
                        <div class="stat-label">To do</div>
                        <div class="stat-value" id="remainingQuests">0</div>
                    </div>
                    <div class="stat-star">★</div>
                    <div class="stat-shine"></div>
                </div>

                <!-- Bottom - Remaining -->
                <div class="stat-orb bottom" id="remainingOrbBottom" data-label="Remaining">
                    <div class="orb-aura"></div>
                    <div class="stat-facet facet-1"></div>
                    <div class="stat-facet facet-2"></div>
                    <div class="stat-facet facet-3"></div>
                    <div class="stat-facet facet-4"></div>
                    <div class="stat-facet facet-5"></div>
                    <div class="stat-facet facet-6"></div>
                    <div class="stat-facet facet-7"></div>
                    <div class="stat-light"></div>
                    <div class="stat-content">
                        <div class="stat-label">Remaining</div>
                        <div class="stat-value" id="remainingBottom">0</div>
                    </div>
                    <div class="stat-star">★</div>
                    <div class="stat-shine"></div>
                </div>
            </div>

            <!-- Quests List -->
            <div class="quests-section">
                <h2>Active Quests</h2>
                <div id="questsList" class="quests-list">
                    <div class="loading-spinner">Loading...</div>
                </div>
            </div>

            <!-- Admin Stats Section -->
            <div id="adminStatsSection" class="admin-stats-section" style="display: none;">
                <h2>Global Stats (Admin)</h2>
                <div class="admin-stats-grid">
                    <div class="admin-stat-card">
                        <div class="admin-stat-label">Total Quests Completed</div>
                        <div class="admin-stat-value" id="globalTotalCompleted">0</div>
                    </div>
                    <div class="admin-stat-card">
                        <div class="admin-stat-label">Total Quests Available</div>
                        <div class="admin-stat-value" id="globalTotalQuests">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Générer les étoiles de fond
        const starfield = document.querySelector('.starfield');
        for (let i = 0; i < 300; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.width = (Math.random() * 2 + 1) + 'px';
            star.style.height = star.style.width;
            starfield.appendChild(star);
        }

        let isAdmin = false;

        async function loadUser() {
            try {
                const res = await fetch('/api/user');
                if (!res.ok) throw new Error('Unauthorized');
                const user = await res.json();
                isAdmin = user.isAdmin || false;
                const avatarImg = document.getElementById('sidebarAvatar');
                if (user.avatar) {
                    avatarImg.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`;
                    avatarImg.onerror = function() {
                        this.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                    };
                } else {
                    avatarImg.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                }
                document.getElementById('sidebarUsername').textContent = user.username;
                document.getElementById('greeting').textContent = `Welcome, ${user.global_name || user.username}!${isAdmin ? ' (Admin)' : ''}`;

                // Show/hide admin stats section
                const adminStatsSection = document.getElementById('adminStatsSection');
                if (adminStatsSection) {
                    adminStatsSection.style.display = isAdmin ? 'block' : 'none';
                }
            } catch {
                window.location.href = '/login';
            }
        }

        // 5 clicks sur Welcome pour désactiver le cooldown
        document.getElementById('greeting').addEventListener('click', () => {
            welcomeClicks++;
            clearTimeout(welcomeClickTimer);
            welcomeClickTimer = setTimeout(() => {
                welcomeClicks = 0;
            }, 2000);

            if (welcomeClicks >= 5) {
                welcomeClicks = 0;
                // Désactiver le cooldown
                clearInterval(cooldownInterval);
                localStorage.removeItem('questCooldown');
                cooldownEnd = null;
                document.getElementById('completeAllBtn').style.pointerEvents = 'auto';
                document.querySelector('.stat-orb.center .stat-label').textContent = 'Do All';
                alert('Cooldown désactivé !');
            }
        });

        async function loadQuests() {
            try {
                const res = await fetch('/api/quests');
                const data = await res.json();
                const total = data.total || 0;
                const completed = data.completed || 0;
                const remaining = data.uncompleted?.length || 0;
                document.getElementById('completedQuests').textContent = completed;
                document.getElementById('remainingQuests').textContent = remaining;
                document.getElementById('remainingBottom').textContent = remaining;
                document.getElementById('questCount').textContent = remaining;

                const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
                document.getElementById('progressPercent').textContent = `${pct}%`;
                document.getElementById('progressFill').style.width = `${pct}%`;

                // Update admin stats if available
                if (data.globalStats && isAdmin) {
                    document.getElementById('globalTotalCompleted').textContent = data.globalStats.totalCompleted;
                    document.getElementById('globalTotalQuests').textContent = data.globalStats.totalQuests;
                }

                const list = document.getElementById('questsList');
                if (!data.uncompleted || data.uncompleted.length === 0) {
                    list.innerHTML = `<div class="loading-spinner">All done!</div>`;
                    return;
                }

                list.innerHTML = data.uncompleted.map((q) => {
                    const expiresAt = new Date(q.config.expires_at);
                    const timeLeft = getTimeRemaining(expiresAt);

                    return `
                        <div class="quest-card" data-id="${q.id}">
                            <div class="quest-left">
                                <div>
                                    <div class="quest-title">${q.config.messages.quest_name}</div>
                                    <div class="quest-sub">${q.config.messages.game_title}</div>
                                </div>
                                <span class="quest-expiry">${timeLeft}</span>
                            </div>
                            <button class="btn-quest" onclick="completeQuest('${q.id}')">Do</button>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('questsList').innerHTML = `<div class="loading-spinner">Loading error</div>`;
            }
        }

        function getTimeRemaining(expiresAt) {
            const now = new Date();
            const diff = expiresAt - now;

            if (diff <= 0) return 'Expiré';

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (days > 0) return `${days}d ${hours}h`;
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }

        async function completeQuest(id) {
            const card = document.querySelector(`.quest-card[data-id="${id}"]`);
            const btn = card?.querySelector('.btn-quest');
            if (!btn) return;
            btn.disabled = true;
            btn.textContent = '...';
            try {
                const res = await fetch(`/api/quest/${id}/complete`, { method: 'POST' });
                if (res.ok) {
                    btn.textContent = 'Done';
                    btn.classList.add('done');
                    setTimeout(loadQuests, 800);
                } else {
                    btn.textContent = 'Error';
                    setTimeout(() => { btn.disabled = false; btn.textContent = 'Do'; }, 1500);
                }
            } catch {
                btn.textContent = 'Error';
                setTimeout(() => { btn.disabled = false; btn.textContent = 'Do'; }, 1500);
            }
        }

        // Cooldown de 16 minutes (15 min pour la quête + 1 min de marge)
        const COOLDOWN_TIME = 16 * 60 * 1000; // 16 minutes en millisecondes
        let cooldownEnd = localStorage.getItem('questCooldown');
        let cooldownInterval;
        let welcomeClicks = 0;
        let welcomeClickTimer;

        function updateCooldown() {
            const now = Date.now();
            const remaining = cooldownEnd - now;

            if (remaining <= 0) {
                clearInterval(cooldownInterval);
                localStorage.removeItem('questCooldown');
                document.getElementById('completeAllBtn').style.pointerEvents = 'auto';
                document.querySelector('.stat-orb.center .stat-label').textContent = 'Do All';
                return;
            }

            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            document.querySelector('.stat-orb.center .stat-label').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function startCooldown() {
            cooldownEnd = Date.now() + COOLDOWN_TIME;
            localStorage.setItem('questCooldown', cooldownEnd);

            document.getElementById('completeAllBtn').style.pointerEvents = 'none';

            cooldownInterval = setInterval(updateCooldown, 1000);
            updateCooldown();
        }

        // Vérifier si un cooldown est en cours au chargement
        if (cooldownEnd && parseInt(cooldownEnd) > Date.now()) {
            document.getElementById('completeAllBtn').style.pointerEvents = 'none';
            cooldownInterval = setInterval(updateCooldown, 1000);
            updateCooldown();
        }

        async function completeAll() {
            const btn = document.getElementById('completeAllBtn');
            btn.style.pointerEvents = 'none';
            document.querySelector('.stat-orb.center .stat-label').textContent = 'Processing...';

            try {
                const res = await fetch('/api/quests/complete-all', { method: 'POST' });
                if (res.ok) {
                    startCooldown();
                    setTimeout(loadQuests, 1000);
                } else {
                    btn.style.pointerEvents = 'auto';
                    document.querySelector('.stat-orb.center .stat-label').textContent = 'Error';
                    setTimeout(() => {
                        document.querySelector('.stat-orb.center .stat-label').textContent = 'Do All';
                    }, 2000);
                }
            } catch {
                btn.style.pointerEvents = 'auto';
                document.querySelector('.stat-orb.center .stat-label').textContent = 'Error';
                setTimeout(() => {
                    document.querySelector('.stat-orb.center .stat-label').textContent = 'Do All';
                }, 2000);
            }
        }

        document.getElementById('completeAllBtn').addEventListener('click', completeAll);

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login';
        });

        loadUser();
        loadQuests();

        // Ne rafraîchir les données que toutes les 30 secondes
        setInterval(() => {
            loadQuests();
        }, 30000);
    </script>
</body>
</html>
