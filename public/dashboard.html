<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbistral · Dashboard</title>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* =========================================================
           ORBISTRAL design system — deep-space console
           ========================================================= */
        :root {
            --radius: 1.1rem;
            --radius-sm: calc(var(--radius) - 4px);
            --radius-md: calc(var(--radius) - 2px);
            --radius-lg: var(--radius);
            --radius-xl: calc(var(--radius) + 4px);
            --radius-2xl: calc(var(--radius) + 8px);

            --background: oklch(0.14 0.035 267);
            --foreground: oklch(0.96 0.012 260);
            --card: oklch(0.19 0.045 268 / 0.72);
            --card-foreground: oklch(0.96 0.012 260);
            --primary: oklch(0.72 0.16 232);
            --primary-foreground: oklch(0.15 0.04 265);
            --secondary: oklch(0.26 0.05 268);
            --secondary-foreground: oklch(0.94 0.015 260);
            --muted: oklch(0.24 0.045 268);
            --muted-foreground: oklch(0.68 0.035 265);
            --accent: oklch(0.58 0.2 275);
            --accent-foreground: oklch(0.98 0.01 260);
            --destructive: oklch(0.64 0.22 15);
            --destructive-foreground: oklch(0.98 0.01 260);
            --border: oklch(0.72 0.12 260 / 0.16);
            --input: oklch(0.72 0.12 260 / 0.2);
            --ring: oklch(0.72 0.16 232);
            --gold: oklch(0.85 0.16 88);
            --gold-foreground: oklch(0.2 0.05 60);
            --success: oklch(0.78 0.17 160);
            --cyan: oklch(0.82 0.14 205);
            --nebula: oklch(0.62 0.24 320);

            --orb-size: 220px;
            --orb-glow: rgba(0, 210, 255, 0.55);
            --bg-deep: #02030a;
            --glass: rgba(7, 10, 31, 0.67);
            --border-glass: rgba(120, 140, 255, 0.12);
            --text-soft: #858dac;
            --text-bright: #eef1ff;
            --accent: #3e68ff;
            --accent-cyan: #17c8f2;
            --accent-pink: #ff31db;
            --radius-lg: 22px;
            --radius-md: 13px;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: var(--background);
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
            color: var(--foreground);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------------------------------------------------------
           STARFIELD - animées mais pas robotiques
           --------------------------------------------------------- */
        .starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 72% 12%, oklch(0.5 0.2 275 / 0.28), transparent 42%),
                radial-gradient(circle at 12% 78%, oklch(0.7 0.15 205 / 0.16), transparent 40%),
                radial-gradient(circle at 50% 120%, oklch(0.7 0.18 330 / 0.12), transparent 45%),
                linear-gradient(160deg, oklch(0.12 0.03 265), oklch(0.16 0.045 270) 45%, oklch(0.11 0.03 265));
            animation: pulse-glow 8s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        /* Neon particles effect */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 200, 50, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 200, 50, 0.8);
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            opacity: 0.4;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.9), 0 0 8px rgba(100, 150, 255, 0.4);
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.4);
            }
            30% {
                opacity: 0.9;
                transform: scale(1.1);
            }
            60% {
                opacity: 0.3;
                transform: scale(0.6);
            }
        }

        /* ---------------------------------------------------------
           DASHBOARD LAYOUT
           --------------------------------------------------------- */
        .dashboard-container {
            position: relative;
            z-index: 2;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            position: sticky;
            top: 0;
            width: 255px;
            flex-shrink: 0;
            height: 100vh;
            padding: 26px 18px;
            background: rgba(7, 10, 31, 0.67);
            border-right: 1px solid rgba(120, 140, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0, 0, 0, .42), 0 0 40px rgba(51, 74, 255, .08);
        }

        .sidebar-brand {
            padding: 0 8px 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(120, 140, 255, 0.12);
            color: var(--foreground);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            text-shadow: 0 0 20px rgba(0, 238, 255, 0.5);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 20px;
            padding: 0 7px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            padding: 12px;
            border: 1px solid rgba(120, 140, 255, 0.08);
            transition: all 0.3s ease;
        }

        .sidebar-header:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(145, 200, 255, 0.2);
            transform: translateY(-2px);
        }

        .sidebar-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            border: 2px solid rgba(0, 238, 255, 0.5);
            background: var(--background);
            box-shadow: 0 0 24px rgba(0, 238, 255, 0.3), 0 0 40px rgba(0, 238, 255, 0.1);
            transition: transform 0.3s var(--ease-bounce), box-shadow 0.3s ease;
            object-fit: cover;
        }

        .sidebar-avatar:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 0 35px rgba(0, 238, 255, 0.5), 0 0 60px rgba(0, 238, 255, 0.2);
        }

        .sidebar-username {
            font-size: 15px;
            font-weight: 700;
            color: var(--foreground);
            text-shadow: 0 0 10px rgba(0, 238, 255, 0.3);
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--muted-foreground);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 238, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--cyan));
            transition: width 0.4s ease;
        }

        .nav-item:hover::before {
            left: 100%;
        }

        .nav-item:hover::after {
            width: 100%;
        }

        .nav-item:hover {
            background: rgba(0, 238, 255, 0.08);
            border-color: rgba(0, 238, 255, 0.3);
            color: var(--foreground);
            transform: translateX(8px) scale(1.02);
            box-shadow: 0 0 30px rgba(0, 238, 255, 0.2), 0 0 60px rgba(0, 238, 255, 0.1);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(0, 238, 255, 0.15), rgba(0, 150, 255, 0.1));
            color: var(--primary);
            border-color: rgba(0, 238, 255, 0.4);
            transform: translateX(8px);
            box-shadow: 0 0 40px rgba(0, 238, 255, 0.3), 0 0 80px rgba(0, 238, 255, 0.15);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .nav-item.active::after {
            width: 100%;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 40px rgba(0, 238, 255, 0.3), 0 0 80px rgba(0, 238, 255, 0.15);
            }
            50% {
                box-shadow: 0 0 60px rgba(0, 238, 255, 0.5), 0 0 100px rgba(0, 238, 255, 0.25);
            }
        }

        .nav-item i {
            width: 18px;
            height: 18px;
            color: var(--muted-foreground);
            transition: all 0.3s ease;
        }

        .nav-item:hover i {
            color: var(--primary);
            transform: scale(1.2) rotate(5deg);
            filter: drop-shadow(0 0 10px rgba(0, 238, 255, 0.8));
        }

        .btn-logout {
            width: 100%;
            height: 39px;
            margin-top: auto;
            border: 1px solid rgba(255, 100, 145, 0.2);
            border-radius: var(--radius-md);
            background: rgba(255, 70, 110, 0.1);
            color: #ff9bb6;
            font: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-logout:hover {
            background: rgba(255, 70, 110, 0.2);
            border-color: rgba(255, 100, 145, 0.4);
            color: #ffb3c6;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 70, 110, 0.3);
        }

        .btn-logout:active {
            transform: translateY(0) scale(0.97);
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            max-width: 1080px;
            margin: 0 auto;
            padding: 54px 48px 70px;
            animation: rise 0.7s var(--ease-out-expo) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            position: relative;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: rgba(0, 238, 255, 0.1);
            border: 1px solid rgba(0, 238, 255, 0.3);
            padding: 10px 20px;
            border-radius: var(--radius-md);
            color: var(--foreground);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .back-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 238, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .back-btn:hover::before {
            left: 100%;
        }

        .back-btn:hover {
            background: rgba(0, 238, 255, 0.2);
            border-color: rgba(0, 238, 255, 0.5);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 238, 255, 0.3), 0 0 60px rgba(0, 238, 255, 0.15);
        }

        .back-btn:active {
            transform: translateY(-1px) scale(1.02);
        }

        .header::after {
            content: "";
            position: absolute;
            top: -25px;
            right: 8%;
            width: 180px;
            height: 120px;
            background: radial-gradient(circle, var(--primary), transparent 70%);
            filter: blur(20px);
            pointer-events: none;
            animation: headerGlowShift 8s ease-in-out infinite;
        }

        @keyframes headerGlowShift {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(10px, -5px);
            }
        }

        .header h1 {
            margin-bottom: 7px;
            color: var(--foreground);
            font-size: clamp(28px, 3vw, 38px);
            font-weight: 700;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }

        .header h1:active {
            color: var(--cyan);
        }

        .header-sub {
            color: var(--muted-foreground);
            font-size: 13px;
        }

        .header-stats {
            margin-top: 17px;
            display: flex;
            gap: 12px;
        }

        .header-stat {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--secondary);
            backdrop-filter: blur(10px);
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .header-stat:hover {
            border-color: var(--primary);
            background: var(--muted);
        }

        .stat-label {
            color: var(--muted-foreground);
            font-size: 9px;
            font-weight: 650;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .stat-value {
            color: var(--foreground);
            font-size: 14px;
            font-weight: 750;
            transition: all 0.3s var(--ease-bounce);
        }

        /* GLASS PANELS */
        .glass-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(18px);
            box-shadow: 0 30px 80px oklch(0.1 0.05 265 / 0.55);
        }

        /* ---------------------------------------------------------
           CENTER ORB - Do All
           --------------------------------------------------------- */
        .stats-simple {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto 30px;
            padding: 20px 20px 70px;
        }

        .stat-orb {
            position: relative;
            width: var(--orb-size);
            height: var(--orb-size);
            overflow: hidden;
            clip-path: polygon(50% 0%, 69% 5%, 87% 17%, 97% 38%, 94% 62%, 82% 82%, 62% 96%, 39% 100%, 18% 88%, 6% 68%, 2% 47%, 9% 25%, 25% 9%);
            background: radial-gradient(circle at 48% 42%, #173bd0 0%, #10299c 25%, #071557 55%, #030726 82%, #010113 100%);
            box-shadow: 0 0 8px var(--orb-glow), 0 0 16px var(--cyan), 0 0 32px var(--primary);
            transform: rotate(-2deg);
            cursor: pointer;
            transition: transform 0.4s var(--ease-bounce), box-shadow 0.4s ease;
            animation: orbIdle 6s ease-in-out infinite;
        }

        @keyframes orbIdle {
            0%,
            100% {
                transform: rotate(-2deg) translateY(0);
            }
            30% {
                transform: rotate(-1deg) translateY(-6px);
            }
            60% {
                transform: rotate(-2.5deg) translateY(-2px);
            }
        }

        .stat-orb:hover {
            transform: rotate(-2deg) scale(1.06) translateY(-4px);
            box-shadow: 0 0 20px var(--orb-glow), 0 0 40px var(--cyan), 0 0 60px var(--primary);
            animation-play-state: paused;
        }

        .stat-orb:active {
            transform: rotate(-2deg) scale(0.94);
            transition: transform 0.1s ease;
            box-shadow: 0 0 30px var(--cyan), 0 0 50px var(--primary);
        }

        /* cooldown state */
        .stat-orb.cooldown {
            cursor: not-allowed;
            filter: brightness(0.6) saturate(0.4);
            animation: cooldownPulse 2s ease-in-out infinite;
        }

        .stat-orb.cooldown:hover {
            transform: rotate(-2deg) scale(1);
            box-shadow: 0 0 5px rgba(255, 100, 100, 0.3);
        }

        /* All done state */
        .stat-orb.alldone {
            cursor: not-allowed;
            filter: brightness(0.7) saturate(0.5);
            box-shadow: 0 0 15px var(--success);
        }

        .stat-orb.alldone:hover {
            transform: rotate(-2deg) scale(1);
            box-shadow: 0 0 15px var(--success);
        }

        @keyframes cooldownPulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        /* TEXT AURORA */
        .text-aurora {
            background: linear-gradient(96deg, var(--cyan), var(--primary) 45%, var(--nebula));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Facets */
        .stat-facet {
            position: absolute;
            pointer-events: none;
            mix-blend-mode: screen;
            opacity: .78;
            transition: opacity 0.5s ease;
        }

        .stat-orb:hover .stat-facet {
            opacity: 0.95;
        }

        .facet-1 {
            width: 80px;
            height: 80px;
            top: 15%;
            left: 10%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4), transparent 70%);
        }

        .facet-2 {
            width: 60px;
            height: 60px;
            bottom: 20%;
            right: 15%;
            background: radial-gradient(circle, var(--cyan), transparent 70%);
        }

        .facet-3 {
            width: 40px;
            height: 40px;
            top: 50%;
            right: 25%;
            background: radial-gradient(circle, var(--nebula), transparent 70%);
            left: 64px;
            top: -5px;
            background: linear-gradient(135deg, #00e8ff, #164cff 40%, #2529c9);
            clip-path: polygon(20% 0, 70% 10%, 100% 55%, 56% 100%, 0 62%);
            opacity: .65;
        }
        .facet-4 {
            width: 115px;
            height: 150px;
            right: -3px;
            top: 18px;
            background: linear-gradient(135deg, #6428ff, #ff31db, #813eff);
            clip-path: polygon(20% 0, 100% 22%, 85% 72%, 48% 100%, 0 70%, 35% 38%);
            opacity: .72;
        }
        .facet-5 {
            width: 115px;
            height: 130px;
            right: -15px;
            top: 95px;
            background: linear-gradient(160deg, #00dfff, #0645ff 45%, #531dff);
            clip-path: polygon(35% 0, 100% 25%, 90% 75%, 50% 100%, 0 55%);
            opacity: .6;
        }
        .facet-6 {
            width: 180px;
            height: 95px;
            left: 50px;
            bottom: -10px;
            background: linear-gradient(90deg, #00e8d5, #006aff, #b830ff);
            clip-path: polygon(0 35%, 35% 0, 75% 18%, 100% 62%, 65% 100%, 22% 82%);
            opacity: .72;
        }
        .facet-7 {
            width: 95px;
            height: 95px;
            right: 25px;
            bottom: 5px;
            background: linear-gradient(135deg, #ff2bd6, #7632ff, #00eaff);
            clip-path: polygon(10% 20%, 62% 0, 100% 50%, 55% 100%, 0 72%);
            opacity: .55;
        }

        .stat-light {
            position: absolute;
            width: 100px;
            height: 100px;
            left: 50%;
            top: 47%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(53, 111, 255, .2) 0%, rgba(0, 125, 255, .08) 35%, transparent 70%);
            filter: blur(12px);
            z-index: 4;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .stat-orb:hover .stat-light {
            background: radial-gradient(circle, rgba(53, 150, 255, .35) 0%, rgba(0, 180, 255, .15) 35%, transparent 70%);
            filter: blur(18px);
        }

        .stat-content {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 12;
            text-align: center;
            pointer-events: none;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 238, 255, 0.5);
            transition: all 0.3s ease;
        }

        .stat-value {
            color: white;
            font-size: 32px;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 238, 255, 0.8);
            transition: all 0.3s var(--ease-bounce);
        }

        .stat-doall-text {
            color: white;
            font-size: 24px;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 238, 255, 0.8);
            transition: all 0.3s var(--ease-bounce);
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-star {
            position: absolute;
            left: 50%;
            top: 35%;
            transform: translate(-50%, -50%) rotate(8deg);
            z-index: 6;
            font-size: 40px;
            line-height: 1;
            color: rgba(255, 255, 255, .9);
            text-shadow: 0 0 2px white, 0 0 6px white, 0 0 12px #9fc8ff, 0 0 20px #386dff;
            pointer-events: none;
            filter: blur(.1px);
            transition: text-shadow 0.4s ease;
        }

        .stat-orb:hover .stat-star {
            text-shadow: 0 0 4px white, 0 0 10px white, 0 0 20px #b0d4ff, 0 0 35px #5a90ff;
        }

        .stat-shine {
            position: absolute;
            width: 70px;
            height: 35px;
            top: 16px;
            left: 32px;
            border-radius: 50%;
            background: linear-gradient(120deg, rgba(255, 255, 255, .18), transparent);
            filter: blur(8px);
            transform: rotate(-25deg);
            z-index: 15;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .stat-orb:hover .stat-shine {
            width: 90px;
            top: 10px;
            left: 20px;
            background: linear-gradient(120deg, rgba(255, 255, 255, .28), transparent);
        }

        /* Border glow */
        .stat-orb::before {
            content: "";
            position: absolute;
            inset: 0;
            background: conic-gradient(from 20deg, #00ffe1, #0077ff, #ff1bd8, #7534ff, #00d9ff, #00ffe1);
            -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 4px;
            z-index: 20;
            pointer-events: none;
            opacity: .85;
            transition: opacity 0.4s ease, padding 0.4s ease;
        }

        .stat-orb:hover::before {
            opacity: 1;
            padding: 3px;

        /* Bubble label below */
        .stat-orb::after {
            content: attr(data-label);

        .stat-orb:hover::after {

        /* ---------------------------------------------------------
           QUEST CARDS - staggered, bouncy
           --------------------------------------------------------- */
        .quests-section h2 {

        .quest-card {

            backdrop-filter: blur(16px);

        }

        @keyframes cardSlideIn {
            from {

        .quest-card:hover {

    <script>
        // Protection contre le vol de code
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'c' || e.key === 'i' || e.key === 'j')) {
                e.preventDefault();
            }
            if (e.key === 'F12') {
                e.preventDefault();
            }
        });

        // Désactiver la sélection de texte
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        // --- STARS ---
        (function() {
            const sf = document.getElementById('starfield');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 250; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
                star.style.setProperty('--delay', Math.random() * 6 + 's');
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                frag.appendChild(star);
            }
            sf.appendChild(frag);
        })();

        // Initialize Lucide icons
        lucide.createIcons();

        // Generate particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        createParticles();

        // --- STATE ---
        let isAdmin = false;
        const COOLDOWN_TIME = 16 * 60 * 1000;
        let cooldownEnd = localStorage.getItem('questCooldown');
        let cooldownInterval;
        let welcomeClicks = 0;
        let welcomeClickTimer;

        const $ = (s) => document.querySelector(s);
        const orb = $('#completeAllBtn');
        const orbLabel = orb?.querySelector('.stat-label');

        // --- LOAD USER ---
        async function loadUser() {
            try {
                const res = await fetch('/api/user');
                if (!res.ok) throw new Error('Unauthorized');
                const user = await res.json();
                isAdmin = user.isAdmin || false;

                const avatar = $('#sidebarAvatar');
                avatar.src = user.avatar ?
                    `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128` :
                    'https://cdn.discordapp.com/embed/avatars/0.png';
                avatar.onerror = () => {
                    avatar.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                };

                $('#sidebarUsername').textContent = user.username;
                $('#greeting').textContent = `Welcome, ${user.global_name || user.username}!${isAdmin ? ' (Admin)' : ''}`;

                // Remove ads for admin users
                if (isAdmin) {
                    const adScript = document.getElementById('adScript');
                    if (adScript) {
                        adScript.remove();
                    }
                }
            } catch {
                window.location.href = '/login';
            }
        }

        // --- SECRET COOLDOWN BYPASS (5 clicks on greeting) ---
        $('#greeting').addEventListener('click', () => {
            welcomeClicks++;
            clearTimeout(welcomeClickTimer);
            welcomeClickTimer = setTimeout(() => { welcomeClicks = 0; }, 2000);
            if (welcomeClicks >= 5) {
                welcomeClicks = 0;
                clearInterval(cooldownInterval);
                localStorage.removeItem('questCooldown');
                cooldownEnd = null;
                orb.classList.remove('cooldown');
                orb.style.pointerEvents = 'auto';
                if (orbLabel) orbLabel.textContent = 'Do All';
                // petit feedback visuel
                orb.style.boxShadow = '0 0 30px rgba(0,255,150,0.9)';
                setTimeout(() => { orb.style.boxShadow = ''; }, 600);
            }
        });

        // --- LOAD QUESTS ---
        async function loadQuests() {
            try {
                const res = await fetch('/api/quests');
                const data = await res.json();

                if (data.globalStats && isAdmin) {
                    $('#globalTotalCompleted').textContent = data.globalStats.totalCompleted;
                    $('#globalTotalQuests').textContent = data.globalStats.totalQuests;
                }

                // Vérifier si cooldown actif
                if (cooldownEnd && parseInt(cooldownEnd) > Date.now()) {
                    orb.classList.add('cooldown');
                    orb.style.pointerEvents = 'none';
                } else {
                    orb.classList.remove('cooldown');
                    orb.style.pointerEvents = 'auto';
                }
            } catch (e) {
                console.error('Load quests error:', e);
            }
        }

        // --- COOLDOWN LOGIC ---
        function updateCooldown() {
            const now = Date.now();
            const remaining = cooldownEnd - now;
            if (remaining <= 0) {
                clearInterval(cooldownInterval);
                localStorage.removeItem('questCooldown');
                orb.classList.remove('cooldown');
                orb.style.pointerEvents = 'auto';
                return;
            }
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
        }

        function startCooldown() {
            cooldownEnd = Date.now() + COOLDOWN_TIME;
            localStorage.setItem('questCooldown', cooldownEnd);
            orb.classList.add('cooldown');
            orb.style.pointerEvents = 'none';
            cooldownInterval = setInterval(updateCooldown, 1000);
            updateCooldown();
        }

        if (cooldownEnd && parseInt(cooldownEnd) > Date.now()) {
            orb.classList.add('cooldown');
            orb.style.pointerEvents = 'none';
            cooldownInterval = setInterval(updateCooldown, 1000);
            updateCooldown();
        }

        // --- COMPLETE ALL ---
        async function completeAll() {
            if (orb.classList.contains('cooldown')) return;
            orb.style.pointerEvents = 'none';

            try {
                const res = await fetch('/api/quests/complete-all', { method: 'POST' });
                if (res.ok) {
                    startCooldown();
                    setTimeout(loadQuests, 1000);
                } else {
                    orb.style.pointerEvents = 'auto';
                }
            } catch {
                orb.style.pointerEvents = 'auto';
            }
        }

        orb.addEventListener('click', completeAll);

        // --- LOGOUT ---
        $('#logoutBtn').addEventListener('click', async () => {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/mode-selection';
        });

        // --- GO BACK ---
        function goBack() {
            window.location.href = '/mode-selection';
        }

        // --- INIT ---
        loadUser();
        loadQuests();
        setInterval(loadQuests, 30000);

        // --- CAPTCHA HANDLING ---
        let currentCaptchaAnswer = null;

        async function checkCaptcha() {
            try {
                const res = await fetch('/api/user');
                if (res.status === 403) {
                    const data = await res.json();
                    if (data.captchaRequired) {
                        showCaptchaModal(data.captchaQuestion);
                        return true;
                    }
                }
                return false;
            } catch (error) {
                console.error('Captcha check error:', error);
                return false;
            }
        }

        function showCaptchaModal(question) {
            const modal = document.getElementById('captchaModal');
            const questionEl = document.getElementById('captchaQuestion');
            questionEl.textContent = question;
            modal.classList.add('active');
        }

        function hideCaptchaModal() {
            const modal = document.getElementById('captchaModal');
            modal.classList.remove('active');
        }

        async function submitCaptcha() {
            const answer = document.getElementById('captchaAnswer').value;
            try {
                const res = await fetch('/api/captcha/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answer })
                });
                const data = await res.json();
                if (data.success) {
                    hideCaptchaModal();
                    document.getElementById('captchaAnswer').value = '';
                    // Reload the page or continue with the action
                    location.reload();
                } else {
                    alert('Invalid captcha answer. Please try again.');
                }
            } catch (error) {
                console.error('Captcha verification error:', error);
                alert('Captcha verification failed. Please try again.');
            }
        }

        // Check for captcha on page load and periodically
        checkCaptcha();
        setInterval(checkCaptcha, 60000); // Check every minute
    </script>

    <!-- Captcha Modal -->
