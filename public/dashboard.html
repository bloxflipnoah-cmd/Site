<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — Quest Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand"><span class="dot">◆</span> Quest Dashboard</div>

            <div class="sidebar-header">
                <img id="sidebarAvatar" src="" alt="Avatar" class="sidebar-avatar">
                <div class="sidebar-user">
                    <div id="sidebarUsername" class="sidebar-username">Username</div>
                    <div id="sidebarTag" class="sidebar-tag">#0000</div>
                </div>
            </div>

            <div class="sidebar-note">Quests refresh automatically after each completion. Keep this tab open while running.</div>

            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                <div>
                    <h1 id="greeting">Welcome!</h1>
                    <p class="header-sub">Track your progress and clear every quest in one click.</p>
                </div>
                <div class="header-stats">
                    <div class="header-stat">
                        <span class="stat-label">Remaining</span>
                        <span id="questCount" class="stat-value">0</span>
                    </div>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>Done</h3>
                        <p id="completedQuests">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>To do</h3>
                        <p id="remainingQuests">0</p>
                    </div>
                </div>
            </div>

            <!-- Progress Section -->
            <div class="progress-section">
                <div class="progress-header">
                    <h3>Progress</h3>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions-section">
                <button id="completeAllBtn" class="btn btn-primary btn-large">
                    Complete all
                </button>
            </div>

            <!-- Quests List -->
            <div class="quests-section">
                <h2>Active quests</h2>
                <div id="questsList" class="quests-list">
                    <div class="loading-spinner">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadUser() {
            try {
                const res = await fetch('/api/user');
                if (!res.ok) throw new Error('Unauthorized');
                const user = await res.json();
                const avatarImg = document.getElementById('sidebarAvatar');
                if (user.avatar) {
                    avatarImg.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                    avatarImg.onerror = function() {
                        this.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                    };
                } else {
                    avatarImg.src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                }
                document.getElementById('sidebarUsername').textContent = user.username;
                document.getElementById('sidebarTag').textContent = `#${user.discriminator}`;
                document.getElementById('greeting').textContent = `Welcome, ${user.global_name || user.username}!`;
            } catch {
                window.location.href = '/login';
            }
        }

        async function loadQuests() {
            try {
                const res = await fetch('/api/quests');
                const data = await res.json();
                const total = data.total || 0;
                const completed = data.completed || 0;
                const remaining = data.uncompleted?.length || 0;
                document.getElementById('completedQuests').textContent = completed;
                document.getElementById('remainingQuests').textContent = remaining;
                document.getElementById('questCount').textContent = remaining;

                const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
                document.getElementById('progressPercent').textContent = `${pct}%`;
                document.getElementById('progressFill').style.width = `${pct}%`;

                const list = document.getElementById('questsList');
                if (!data.uncompleted || data.uncompleted.length === 0) {
                    list.innerHTML = `<div class="loading-spinner">All done!</div>`;
                    return;
                }

                list.innerHTML = data.uncompleted.map((q, i) => {
                    const expiresAt = new Date(q.config.expires_at);
                    const timeLeft = getTimeRemaining(expiresAt);

                    return `
                        <div class="quest-card" data-id="${q.id}" style="animation-delay:${i * 45}ms">
                            <div class="quest-left">
                                <div>
                                    <div class="quest-title">${q.config.messages.quest_name}</div>
                                    <div class="quest-sub">${q.config.messages.game_title}</div>
                                </div>
                                <span class="quest-expiry">${timeLeft}</span>
                            </div>
                            <button class="btn-quest" onclick="completeQuest('${q.id}')">Do</button>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('questsList').innerHTML = `<div class="loading-spinner">Loading error</div>`;
            }
        }

        function getTimeRemaining(expiresAt) {
            const now = new Date();
            const diff = expiresAt - now;

            if (diff <= 0) return 'Expired';

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (days > 0) return `${days}d ${hours}h`;
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }

        async function completeQuest(id) {
            const card = document.querySelector(`.quest-card[data-id="${id}"]`);
            const btn = card?.querySelector('.btn-quest');
            if (!btn) return;
            btn.disabled = true;
            btn.textContent = '...';
            try {
                const res = await fetch(`/api/quest/${id}/complete`, { method: 'POST' });
                if (res.ok) {
                    btn.textContent = 'Done';
                    btn.classList.add('done');
                    setTimeout(loadQuests, 800);
                } else {
                    btn.textContent = 'Error';
                    setTimeout(() => { btn.disabled = false; btn.textContent = 'Do'; }, 1500);
                }
            } catch {
                btn.textContent = 'Error';
                setTimeout(() => { btn.disabled = false; btn.textContent = 'Do'; }, 1500);
            }
        }

        document.getElementById('completeAllBtn').addEventListener('click', async function() {
            this.disabled = true;
            this.textContent = 'Processing...';
            try {
                const res = await fetch('/api/quests/complete-all', { method: 'POST' });
                const data = await res.json();
                this.textContent = `${data.completed || 0} done`;
                setTimeout(() => { this.disabled = false; this.textContent = 'Complete all'; loadQuests(); }, 1200);
            } catch {
                this.textContent = 'Error';
                setTimeout(() => { this.disabled = false; this.textContent = 'Complete all'; }, 1500);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/login';
        });

        loadUser();
        loadQuests();
    </script>
</body>
</html>
