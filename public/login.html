<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <h1 class="login-title">Quest Dashboard</h1>
        <p class="login-sub">Login with your Discord token</p>

        <form id="loginForm">
            <input type="password" id="tokenInput" placeholder="Paste your token here..." required autocomplete="off">
            <button type="submit">Login</button>
            <div id="loginError" class="login-error"></div>
        </form>

        <p class="login-foot">Check the Discord channel for how to get your token</p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('tokenInput').value.trim();
            const btn = e.target.querySelector('button');
            const err = document.getElementById('loginError');
            btn.disabled = true;
            btn.textContent = 'Connecting...';
            err.textContent = '';
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect || '/dashboard';
                } else {
                    err.textContent = data.error || 'Invalid token';
                    btn.disabled = false;
                    btn.textContent = 'Login';
                }
            } catch {
                err.textContent = 'Network error';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
