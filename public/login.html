<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-wrapper">
        <div class="login-box">

            <p class="login-sub">Login with your Discord token</p>
            <p class="login-sub" style="font-size: 0.85rem; margin-top: -10px;">Check the channel for how to get your token</p>
            <form id="loginForm">
                <input type="password" id="tokenInput" placeholder="Paste your token here..." required>
                <button type="submit">Login</button>
                <div id="loginError" class="login-error"></div>
            </form>

        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('tokenInput').value.trim();
            const btn = e.target.querySelector('button');
            const err = document.getElementById('loginError');
            btn.disabled = true;
            btn.textContent = 'Connecting...';
            err.textContent = '';
            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect || '/dashboard';
                } else {
                    err.textContent = data.error || 'Invalid token';
                    btn.disabled = false;
                    btn.textContent = 'Login';
                }
            } catch {
                err.textContent = 'Network error';
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
